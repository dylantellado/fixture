[project]
name = "classifier-tuning"
version = "0.1.0"
description = "Tune the needs_response classifier's harness and rules; every run is tracked in Weights & Biases"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-secret-manager>=2.32.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=3.0.0",
    "pyyaml>=6.0.3",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
