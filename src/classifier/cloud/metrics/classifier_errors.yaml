# Log-based counter: failed /classify requests (no label returned), by error type
# (rate_limited, api_error, unreachable, invalid_answer, ... or the exception type)
# and the HTTP status returned (502, 503, 500).
# Metric type: logging.googleapis.com/user/classifier_errors
description: Fixture classifier failed /classify requests, by error type and status
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="fixture-classifier"
  jsonPayload.event="classify"
  jsonPayload.outcome="error"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: error_type
      valueType: STRING
      description: short error kind from the log line
    - key: status
      valueType: STRING
      description: HTTP status the classifier returned
labelExtractors:
  error_type: EXTRACT(jsonPayload.error_type)
  status: EXTRACT(jsonPayload.status)
