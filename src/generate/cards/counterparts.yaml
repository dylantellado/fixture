# Who the user schedules with. Each kind lists the flows (from acts.FLOWS) it
# takes part in, with weights, plus what the meetings are about and how they
# write. "assistant" is the chance their side uses an assistant or coordinator
# (needed by the handoff flows). Domains are reserved example domains.

professor:
  title: Professor
  domain: faculty.college.example
  purposes: [office hours question, recommendation letter, research opportunity, grade question]
  styles: [formal and brief, warm but busy, terse, writes from phone]
  assistant: 0.3
  flows: {they_offer: 2, user_asks: 4, user_asks_restate: 1, decline_then_offer: 1, reschedule_offer: 1, reschedule_directive: 1, cancel_followup: 1, handoff_wait: 1, handoff_ask: 1, sched_link: 1, still_on: 1, thanks: 1, info: 1, task_split: 0}
ta:
  title: Teaching Assistant
  domain: college.example
  purposes: [problem set help, regrade request, project check-in, section swap]
  styles: [casual, friendly, terse]
  assistant: 0
  flows: {user_asks: 3, they_offer: 2, user_offers: 2, cancel_invite: 1, reschedule_directive: 1, info: 1, still_on: 1}
advisor:
  title: Academic Advisor
  domain: advising.college.example
  purposes: [course planning, major declaration, study abroad credit, transfer plan]
  styles: [formal and kind, uses bullet points, brief]
  assistant: 0.4
  flows: {sched_link: 3, user_asks: 3, they_offer: 2, handoff_wait: 1, handoff_ask: 1, cancel_invite: 1, still_on: 1, user_asks_restate: 1}
