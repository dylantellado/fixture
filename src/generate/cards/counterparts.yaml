  domain: talent.acmecorp.example
  purposes: [first-round interview, phone screen, superday, offer call, coffee chat]
  styles: [upbeat and polished, corporate with a legal footer, brief]
  assistant: 0.5
  flows: {they_offer: 3, they_offer_question: 2, sched_link: 3, handoff_wait: 2, handoff_ask: 1, reschedule_offer: 2, cancel_invite: 1, still_on: 1, cold_sales: 0}
hiring_manager:
