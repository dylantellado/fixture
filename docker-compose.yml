# Startup order (see "Data contract" in the README):
#   ingest -> preprocess -> rag   one-shot jobs; each waits for the previous to exit 0
#   chromadb                      vector database; rag waits until it is healthy
#   api                           starts after rag finishes
#   frontend                      starts after api is healthy
#
# Each service is owned by one person (see CLAUDE.md); edit only your own.

services:
  # --- Data pipeline (Will) ---

  # Each pipeline job gets only the folders it uses: read-only inputs,
  # writable outputs. No .env, secrets, or other data (e.g. data/fixture.db).

  ingest:
    build: ./src/ingest
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data/source:/data/source:ro   # users.json, generated_threads.jsonl
      - ./data/raw:/data/raw            # writes threads.jsonl

  preprocess:
    build: ./src/preprocess
    environment:
      - DATA_DIR=/data
      # Recorded in manifest.json. The container has no git, so pass it in:
      #   GIT_COMMIT=$(git rev-parse HEAD) docker compose up --build
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    depends_on:
      ingest:
        condition: service_completed_successfully
    volumes:
      - ./data/source:/data/source:ro   # users.json (so manifest counts list every user)
      - ./data/raw:/data/raw:ro         # reads threads.jsonl
      - ./data/processed:/data/processed  # writes messages.jsonl, manifest.json

  # --- Search (Dylan) ---

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"  # host 8001, because the api uses 8000
    volumes:
      - chroma_data:/data
    healthcheck:
      # The image has no curl or wget, so open a TCP connection with bash instead.
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag:
    build: ./src/rag
    env_file: .env
    environment:
      - DATA_DIR=/data
      - SAMPLES_DIR=/samples  # used only when data/processed/messages.jsonl is missing
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      preprocess:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./samples:/samples:ro
      - model_cache:/root/.cache/chroma  # embedding model downloads once, shared with api

  api:
    build: ./src/api
    env_file: .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      rag:
        condition: service_completed_successfully
    volumes:
      # No ./secrets mount: the api never talks to Google.
      - model_cache:/root/.cache/chroma
    healthcheck:
      # python:3.12-slim has no curl, so use Python to call /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Web app ---

  frontend:
    build: ./src/frontend
    env_file: .env
    environment:
      - SECRETS_DIR=/run/secrets
      - DATA_DIR=/data
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
      - ./data:/data

volumes:
  chroma_data:   # ChromaDB's stored collections
  model_cache:   # all-MiniLM-L6-v2 ONNX model used by rag and api
