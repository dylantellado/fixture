# Startup order (see "Data contract" in the README):
#   ingest -> preprocess -> rag   one-shot jobs; each waits for the previous to exit 0
#   chromadb                      vector database; rag waits until it is healthy
#   api                           starts after rag finishes
#   frontend                      starts after api is healthy
#   classifier                    independent; the frontend falls back to keyword tags while it's down
#   drafter                       independent; "Draft reply" shows an error while it's down
#
# Each service is owned by one person (see CLAUDE.md); edit only your own.

services:
  # --- Data pipeline (Will) ---

  # Each pipeline job gets only the folders it uses: read-only inputs,
  # writable outputs. No .env, secrets, or other data (e.g. data/fixture.db).

  ingest:
    build: ./src/ingest
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data/source:/data/source:ro   # users.json, generated_threads.jsonl
      - ./data/raw:/data/raw            # writes threads.jsonl

  preprocess:
    build: ./src/preprocess
    environment:
      - DATA_DIR=/data
      # Recorded in manifest.json. The container has no git, so pass it in:
      #   GIT_COMMIT=$(git rev-parse HEAD) docker compose up --build
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    depends_on:
      ingest:
        condition: service_completed_successfully
    volumes:
      - ./data/source:/data/source:ro   # users.json (so manifest counts list every user)
      - ./data/raw:/data/raw:ro         # reads threads.jsonl
      - ./data/processed:/data/processed  # writes messages.jsonl, manifest.json

  # --- Search (Dylan) ---

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"  # host 8001, because the api uses 8000
    volumes:
      - chroma_data:/data
    healthcheck:
      # The image has no curl or wget, so open a TCP connection with bash instead.
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 20

  # rag and api embed text with Vertex AI (src/rag/embeddings.py), like the classifier:
  # your gcloud application-default credentials (gcloud auth application-default login),
  # mounted read-only. No .env values or secrets/ folder for this. Indexing sends the
  # fake corpus's email text, and search sends the query, to Vertex AI in our own GCP
  # project; neither is logged. Both must use the same EMBEDDING_MODEL (the api checks).
  rag:
    build: ./src/rag
    env_file: .env
    environment:
      - DATA_DIR=/data
      - SAMPLES_DIR=/samples  # used only when data/processed/messages.jsonl is missing
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-fixture-ac215-96dhbm}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_LOCATION=${EMBEDDING_LOCATION:-us-central1}
    depends_on:
      preprocess:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./samples:/samples:ro
      - ~/.config/gcloud:/root/.config/gcloud:ro

  api:
    build: ./src/api
    env_file: .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-fixture-ac215-96dhbm}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_LOCATION=${EMBEDDING_LOCATION:-us-central1}
    ports:
      - "8000:8000"
    depends_on:
      rag:
        condition: service_completed_successfully
    volumes:
      # Credentials for embedding search queries with Vertex AI (no secrets/ folder).
      - ~/.config/gcloud:/root/.config/gcloud:ro
    healthcheck:
      # python:3.12-slim has no curl, so use Python to call /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Labels the web app's real Gmail emails with Gemini on Vertex AI (see src/classifier/README.md).
  # Uses your gcloud application-default credentials (gcloud auth application-default login),
  # mounted read-only. No .env and no secrets/ folder. Email text goes to Gemini in our own
  # GCP project and is never logged or saved.
  classifier:
    build: ./src/classifier
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-fixture-ac215-96dhbm}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_THINKING_BUDGET=${GEMINI_THINKING_BUDGET:-128}
      - RULES_PATH=/rules/labeling_rules.md
    ports:
      - "8002:8002"
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
      # The labeling rules are read from the repo, so the prompt always matches docs/.
      - ./docs/data/labeling_rules.md:/rules/labeling_rules.md:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Drafts calendar-aware replies for the dashboard's "Draft reply" button (see src/drafter/README.md).
  # Each request carries the thread, free/busy times and past emails; the drafter holds no Google
  # user credentials and never reads Gmail or Calendar, sends email or writes to a calendar. It calls
  # Gemini and embeddings on Vertex AI with your gcloud application-default credentials (mounted
  # read-only), and the classifier when the web app has no cached label. Email text and drafts are
  # never logged or saved.
  drafter:
    build: ./src/drafter
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-fixture-ac215-96dhbm}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      # Its own variable, so the classifier's GEMINI_THINKING_BUDGET can't change it.
      - GEMINI_THINKING_BUDGET=${DRAFTER_THINKING_BUDGET:-512}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_LOCATION=${EMBEDDING_LOCATION:-us-central1}
      # Like the frontend: the classifier service above, unless .env sets CLASSIFIER_URL (e.g. to
      # Cloud Run; the request then carries an ID token from the mounted gcloud credentials).
      - CLASSIFIER_URL=${CLASSIFIER_URL:-http://classifier:8002}
    ports:
      - "8003:8003"
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Web app ---

  frontend:
    build: ./src/frontend
    env_file: .env
    environment:
      - SECRETS_DIR=/run/secrets
      - DATA_DIR=/data
      - API_URL=http://api:8000
      # The classifier service above, unless .env sets CLASSIFIER_URL (e.g. to Cloud Run).
      - CLASSIFIER_URL=${CLASSIFIER_URL:-http://classifier:8002}
      - DRAFTER_URL=http://drafter:8003
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
      - ./data:/data
      # gcloud credentials for the ID token the Cloud Run classifier requires (unused for the local one).
      - ~/.config/gcloud:/root/.config/gcloud:ro

volumes:
  chroma_data:   # ChromaDB's stored collections
